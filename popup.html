<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="popup.css" />
</head>
<body>
<header>
<div class="logo">🔗</div>
<div>
<h1>Link Updater</h1>
<p class="subtitle">for Confluence editor links</p>
</div>
</header>

<div class="settings-panel">
<div class="match-replace">
<div class="input-group">
<label>Matched text</label>
<input type="text" id="matchValue" placeholder="gitlab.com" />
</div>
<div class="separator">→</div>
<div class="input-group">
<label>Replace with</label>
<input type="text" id="replaceValue" placeholder="gitlab-dedicated.com" />
</div>
</div>
</div>

<div class="button-row">
<button id="scanBtn" class="secondary-button">🔍 Scan</button>
<button id="runBtn" class="primary-button">▶ Run</button>
<button id="stopBtn" class="danger-button">⏹</button>
<button id="clearBtn" class="secondary-button">🧹 Clear</button>
</div>

<div id="statusLine" class="status-message"></div>

<div class="results-box">
<table class="results-table">
<thead>
<tr>
<th class="number-column">#</th>
<th>URL change</th>
<th class="status-column">Status</th>
</tr>
</thead>
<tbody id="logBody"></tbody>
</table>
<div id="logEmpty" class="no-results">Ready. Fill in the fields above and hit Scan or Run.</div>
</div>

<script src="popup.js"></script>
</body>
</html>
